model_list:
  - model: model1
    base_url: base_url1
    api_key: api_key1
  - model: model2
    base_url: base_url2
    api_key: api_key2

mol_compare:
  # Omit backend to preserve the historical ChemDraw default.
  # Set backend: opsin to use local open-source comparison (no tool API key).
  backend: chemdraw
  url: xxx_url/chemdraw/api/batch_mol_compare
  api_key: xxx_api_key
  timeout: 30
  # OPSIN paths are relative to this YAML file; also supports OPSIN_JAR env var.
  jar_path: ../../tools/opsin/opsin-cli-2.9.0-jar-with-dependencies.jar
  java: java
