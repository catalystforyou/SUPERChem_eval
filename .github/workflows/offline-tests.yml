name: Offline reproducibility
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-offline.txt
      - run: python -m unittest discover -s tests -v
      - run: python demo/run_demo.py
      - run: python -m superchem validate --manifest demo/manifest.json --require-matches
  opsin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements-offline.txt -r requirements-mol.txt openai PyYAML loguru tqdm
      - run: python script/install_opsin.py
      - run: python -m unittest discover -s tests -v
        env:
          SUPERCHEM_RUN_OPSIN_TESTS: '1'
